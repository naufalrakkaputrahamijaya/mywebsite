<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website SPATIAL, Departemen Teknologi Kebumian UGM.">
    <meta name="keywords" content="SPATIAL, UGM, DTK">
    <meta name="author" content="Panitia SPATIAL 2025/2026">
    <title>Klasemen Gugus SPATIAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
    @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1874&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: scroll;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInSlideUp 1s ease-out forwards;
        }

        h1 {
            text-align: center;
            color: #1a5276;
            font-size: 2.8em;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInSlideUp 1s ease-out 0.5s forwards;
        }

        h1 .emoji {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        h1:hover .emoji {
            animation: pulse 1s infinite;
        }

        .logo {
            display: block;
            margin: 0 auto 20px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.7);
            animation: fadeInSlideUp 1s ease-out 0.2s forwards;
            opacity: 0;
        }

        #myChart {
            margin-top: 30px;
        }

        /* Tabel baru */
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            overflow: hidden;
            animation: fadeInSlideUp 1s ease-out 1s forwards;
        }

        .ranking-table th,
        .ranking-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .ranking-table th {
            background-color: #1a5276;
            color: #fff;
            font-weight: 700;
        }

        .ranking-table tr:hover {
            background-color: rgba(26, 82, 118, 0.1);
        }

        .up {
            color: green;
            font-weight: bold;
        }

        .down {
            color: red;
            font-weight: bold;
        }

        /* Responsive for mobile and tablet */
        @media (max-width: 900px) {
            .container {
                padding: 20px;
            }
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
                max-width: 100vw;
            }
            h1 {
                font-size: 2em;
            }
            .logo {
                width: 80px;
                height: 80px;
            }
        }
        @media (max-width: 425px) {
            h1 {
                font-size: 1.3em;
            }
            .logo {
                width: 60px;
                height: 60px;
            }
            .container {
                padding: 5px;
            }
        }
        @media (max-width: 375px) {
            h1 {
                font-size: 1.1em;
            }
        }
        @media (max-width: 320px) {
            h1 {
                font-size: 1em;
            }
        }
        /* Table horizontal scroll for small screens */
        @media (max-width: 768px) {
            .ranking-table {
                display: block;
                width: 100%;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="klasemenPoin.js"></script>
</head>

<body>
    <div class="container">
        <img src="logo.jpg" alt="Logo SPATIAL" class="logo">
        <h1><span class="emoji">🌿</span> Klasemen Gugus SPATIAL<span class="emoji">🌿</span></h1>
        <canvas id="myChart"></canvas>

        <!-- Tabel lama dihapus, data diambil dari file klasemenPoin.js -->

        <!-- Tabel Klasemen Baru -->
        <table id="rankingTable" class="ranking-table">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Status</th>
                    <th>Gugus</th>
                    <th>Tugas 1</th>
                    <th>Tugas 2</th>
                    <th>Tugas 3</th>
                    <th>Tugas 4</th>
                    <th>Tugas 5</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // ===== Grafik Klasemen Lama dari klasemenPoin.js =====
        const labels = klasemenPoin.map(t => t.name);
        const data = klasemenPoin.map(t => t.poin);

        const ctx = document.getElementById('myChart').getContext('2d');
        const barColors = [
            '#27ae60', '#2980b9', '#8e44ad', '#f39c12',
            '#d35400', '#c0392b', '#16a085', '#34495e', '#7f8c8d'
        ];
        const barColorsHover = [
            '#43e97b', '#5dade2', '#bb8fce', '#ffe082',
            '#ffb074', '#ff7675', '#48c9b0', '#85929e', '#b2bec3'
        ];
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Poin Tim',
                    data: data,
                    backgroundColor: barColors,
                    borderColor: 'rgba(255, 255, 255, 0.5)',
                    borderWidth: 2,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: {
                        display: true,
                        text: 'Peringkat Gugus SPATIAL',
                        font: { size: 20, family: 'Quicksand' },
                        color: '#1a5276'
                    },
                    tooltip: {
                        enabled: true,
                        external: function(context) {
                            // default tooltip
                        }
                    }
                },
                hover: {
                    mode: 'nearest',
                    intersect: true
                },
                onHover: (event, chartElement) => {
                    const dataset = chart.data.datasets[0];
                    if (chartElement.length > 0) {
                        const idx = chartElement[0].index;
                        dataset.backgroundColor = barColors.map((color, i) => i === idx ? barColorsHover[i] : color);
                        chart.update('none');
                        event.native.target.style.cursor = 'pointer';
                    } else {
                        dataset.backgroundColor = barColors;
                        chart.update('none');
                        event.native.target.style.cursor = 'default';
                    }
                }
            }
        });

        // ===== TABEL KLASMEN BARU dari klasemenPoin.js =====
        // klasemenDetail diambil dari file klasemenPoin.js
        const tbody = document.querySelector("#rankingTable tbody");
        // Hitung total poin dari array tugas
        const teams = klasemenDetail.map(team => ({
            name: team.name,
            tugas: team.tugas,
            total: team.tugas.reduce((sum, val) => sum + (typeof val === 'number' && !isNaN(val) ? val : 0), 0)
        }));
        // Urutkan berdasarkan total poin tertinggi
        teams.sort((a, b) => b.total - a.total);
        teams.forEach((team, index) => {
            const tr = document.createElement("tr");
            const statusIcon = index % 2 === 0 ? "⬆️" : "⬇️";
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${statusIcon}</td>
                <td>${team.name}</td>
                ${team.tugas.map(t => `<td>${t}</td>`).join('')}
                <td><strong>${team.total}</strong></td>
            `;
            tbody.appendChild(tr);
        });
    </script>
</body>

</html>
